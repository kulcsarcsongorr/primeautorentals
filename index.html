<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Auto Rentals</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; }
h1 { color: #e60000; text-align: center; }
label { display: block; margin-top: 12px; font-size: 18px; }
select, input { 
  width: 100%; padding: 10px; 
  margin-top: 6px; font-size: 18px; 
  background: #222; color: #fff; 
  border: 1px solid #e60000;
  border-radius: 6px;
}
button {
  margin-top: 20px; width: 100%; padding: 14px;
  background: #e60000; color: #fff; border: none;
  cursor: pointer; font-size: 20px;
  border-radius: 8px;
}
#result { margin-top: 20px; font-weight: bold; font-size: 24px; text-align: center; }
.container { max-width: 400px; margin: auto; }
</style>
</head>
<body>

<div class="container">
<h1>Prime Auto Rentals</h1>

<label>Jármű kategória:</label>
<select id="carType">
  <option value="small">Kis autó</option>
  <option value="minibus">Kis busz</option>
  <option value="minibusPlus">Kis busz +</option>
</select>

<label>Napok száma:</label>
<input type="number" id="days" min="1" value="1">

<label>Megtett km:</label>
<input type="number" id="km" min="0" value="0">

<button onclick="calculate()">Számolás</button>

<div id="result"></div>
</div>

<script>
const cars = {
 small: { daily: 150, included: 400, extra: 0.5 },
 minibus: { daily: 300, included: 400, extra: 1 },
 minibusPlus: { daily: 350, included: 400, extra: 1 }
};

function calculate() {
 let type = document.getElementById('carType').value;
 let days = parseInt(document.getElementById('days').value);
 let km = parseInt(document.getElementById('km').value);

 let c = cars[type];
 let includedKM = c.included * days;
 let extraKM = Math.max(0, km - includedKM);
 let price = (c.daily * days) + (extraKM * c.extra);

 document.getElementById('result').innerHTML =
   `Összeg: ${price.toFixed(2)} lej<br>(Extra km: ${extraKM} km)`;
}

// PWA service worker register
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
