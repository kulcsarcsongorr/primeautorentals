<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Autóbérlés kalkulátor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Autóbérlés kalkulátor</h1>

    <label for="category">Válassza ki az autótípust:</label>
    <select id="category">
      <option value="kis_auto">Kis autó (150 lej/nap)</option>
      <option value="kis_busz">Kis busz (300 lej/nap)</option>
      <option value="kis_busz_plus">Kis busz + (350 lej/nap)</option>
    </select>

    <label for="days">Napok száma:</label>
    <input type="number" id="days" value="1" min="1">

    <label for="km">Teljes megtett km:</label>
    <input type="number" id="km" value="0" min="0">

    <button onclick="calculate()">Számítás</button>

    <div class="result" id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
