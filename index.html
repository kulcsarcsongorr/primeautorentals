<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Auto Rentals</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Prime Auto Rentals Logo" class="logo">
        <h1>Prime Auto Rentals</h1>
    </header>

    <main>
        <h2>Bérleti díj kalkulátor</h2>

        <label for="type">Autó kategória:</label>
        <select id="type">
            <option value="small">Kis autó</option>
            <option value="minibus">Kis busz</option>
            <option value="minibusPlus">Kis busz +</option>
        </select>

        <label for="days">Napok száma:</label>
        <input type="number" id="days" min="1" value="1">

        <label for="km">Megtett km:</label>
        <input type="number" id="km" min="0" value="0">

        <button onclick="calculate()">Számítás</button>

        <div id="result"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
